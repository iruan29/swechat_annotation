[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-chat-project-outcomes"
version = "0.1.0"
description = "Auditable analysis of evolving requirements in SWE-Chat"
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=1.0",
  "pyarrow>=15",
  "requests>=2.31",
  "matplotlib>=3.7",
]

[project.scripts]
swe-chat-analyze = "swe_chat_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
